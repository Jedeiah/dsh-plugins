# REA — 由本地组合包 @jedeiah/rea-dsh 提供。
#
# 本行原先需要手写在 profile 的 `cordis.patch.yml` 里；现在收进这个组合包，
# 于是它能像其它插件一样从 Plugins 页面管理（停用即摘掉，卸载即回退）。
#
# 三条 insert：
#
#   ① rea-dsh        本包（Host 半 + Client 半）。Host 半持有 `skills` 开关，并把
#                    开关变成文件系统事件；技能跟着**启动器记录的版本**走（见下）。
#                    Client 半在 Plugins 页面提供设置页。
#                    行名必须是本包名 —— 浏览器模块表按行名取包，写官方桥名的话
#                    本包的 Client 半边永远不会被加载。
#
#   ② rea-bridge     官方 `@deepseek-ai/dsh-mcp-client` 桥。`command`/`args` 不写死，
#                    交给 launcher.cjs 按阶梯解析（全局 rea → 绝对 node + npx 的 JS 入口
#                    → dsh 自带 node + pnpm → 裸 npx）。单独一行，这样它不受技能开关影响。
#
#   ③ rea-skills     技能提供方，扫本包的 `skills-live/`。
#                    那个目录由 Host 半维护：开则把当前技能来源下的每个技能软链进去，
#                    关则清空。官方 provider 的文件监视器（默认跟随软链）会自己感知，
#                    于是技能在会话目录里实时出现或消失 —— 不用重挂、不用重启。
#
# ── 版本从哪来 ────────────────────────────────────────────────────────────────
# 没有版本文件。REA 的版本是**这一行自己的配置**（dsh 的规范位置：普通配置走 Cordis
# 配置文件，只有可热改的字段才进设置表单 —— 见 `dsh-settings` 的 README）。
# 两种写法都行，`env` 更直观：
#
#     config:
#       serverName: rea
#       transport: stdio
#       env:
#         REA_SPEC: '6.4.0'      # 钉死；不写则跟随 npm 的 latest
#       command: !!js …          # 不用改，照旧
#       args: !!js …             # 不用改，照旧
#
# 也可以在 args 里把它作为启动器参数传下去（等价写法，launcher.mjs 认 `--spec=`）：
#   args: !!js ['…/launcher.mjs', '--spec=6.4.0', 'mcp']
# 注意：**不要**指望 `resolveLaunchPlan({ spec: '6.4.0' }).args` —— shim 模式下它返回的
# args 里没有版本（版本由 shim 在拉起时从 env/argv 读），那样写等于没钉。
#
# 技能不需要单独声明版本：启动器每次拉起时把**实际用的 spec** 写进
# `cache/status.json`，Host 半读那份记录去拉对应的官方技能 —— 所以技能永远跟着
# 真正在跑的服务器，不存在"两处声明对不上"。
#
# ⚠️ 时机：`!!js` 在**条目激活时**求值（官方文档 develop/cordis-tutorial/05-config），
#    而 `env` 只在桥进程启动时传给子进程。所以**改版本要重启 dsh，或在 Plugins 页把
#    这一行停用再启用**；正在跑的服务器不会换。技能那边约 1 秒后跟上新记录。

- insert:
    - id: rea-dsh
      name: '@jedeiah/rea-dsh'

    - id: rea-bridge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio

        # 两个表达式读同一个 plan，因此 command 与 args 永远配套。
        # 无 node 可用时 plan 回落到裸 `npx`，args 也相应变为
        # `['-y', 'rea-agents@<spec>', 'mcp']` —— 两个字段各自从 plan 取值，不会错配。
        command: !!js |-
          (() => {
            const path = process.getBuiltinModule('node:path');
            const { createRequire } = process.getBuiltinModule('node:module');

            // ctx.baseUrl 指向 profile 目录，而不是提供本 patch 的 bundle 目录。
            // 因此从这个锚点解析本包的真实安装位置（与 dsh 自己的 preset patch 同一手法）。
            const pkgDir = path.dirname(
              createRequire(String(ctx.baseUrl ?? '')).resolve('@jedeiah/rea-dsh/package.json'),
            );
            return createRequire(path.join(pkgDir, 'package.json'))('./launcher.cjs').resolveLaunchPlan().command;
          })()
        args: !!js |-
          (() => {
            const path = process.getBuiltinModule('node:path');
            const { createRequire } = process.getBuiltinModule('node:module');

            const pkgDir = path.dirname(
              createRequire(String(ctx.baseUrl ?? '')).resolve('@jedeiah/rea-dsh/package.json'),
            );
            return createRequire(path.join(pkgDir, 'package.json'))('./launcher.cjs').resolveLaunchPlan().args;
          })()

    - id: rea-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: rea-skills
        includeDefaultRoots: false
        customSkillDirs:
          - !!js |-
            (() => {
              const path = process.getBuiltinModule('node:path');
              const { createRequire } = process.getBuiltinModule('node:module');

              const pkgDir = path.dirname(
                createRequire(String(ctx.baseUrl ?? '')).resolve('@jedeiah/rea-dsh/package.json'),
              );
              return path.join(pkgDir, 'skills-live');
            })()
