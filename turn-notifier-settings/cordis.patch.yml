# Turn Notifier Settings — the settings page of `@jedeiah/turn-notifier`.
#
# The row mounts the package's Host half (a no-op: this bundle has no tunables of
# its own); the page lives in the Client half declared by `dsh.client` in
# package.json, and registers itself on the *notifier's* row (`plugins.row.config`
# keyed `<package>#<row id>`) so that switching `turn-notifier` off and on again
# cannot take the page with it.

- insert:
    - id: turn-notifier-settings
      name: '@jedeiah/turn-notifier-settings'
