# Chrome DevTools MCP — provided by the local bundle @jedeiah/chrome-devtools-mcp.
#
# 第一条 insert：把服务器从手写配置收进本组合包，于是它能从 Plugins 页面管理
# （停用即摘掉，卸载即回退）。它插入 dsh 自带的 `@deepseek-ai/dsh-mcp-client` 桥，
# 由 npx 经 stdio 拉起 chrome-devtools-mcp，工具注册为 `mcp__chrome-devtools__<tool>`。
#
# `chrome-devtools-mcp` 由宿主 PATH 上的 `npx` 解析并缓存到 ~/.npm/_npx，
# 因此首次运行需要宿主有 node/npm 与 registry 访问。
#
# 第二条 insert：注册 skill 提供方。chrome-devtools-mcp 自带 7 个技能
# （a11y-debugging、chrome-devtools、chrome-devtools-cli、cookie-debugging、
# debug-optimize-lcp、memory-leak-debugging、troubleshooting），原先只存在于
# npx 缓存里 —— 那不在 dsh 的任何 skill 扫描根之下，所以从未生效。副本随本包分发，
# 路径用 createRequire 从 profile 锚点解析：ctx.baseUrl 指向的是 profile 目录，
# 而不是提供本 patch 的 bundle 目录，不能直接往上拼 `skills/`。
# 手法与 @jedeiah/rea-mcp 一致。

- insert:
    - id: chrome-devtools-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome-devtools
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'chrome-devtools-mcp@latest'
          - '--autoConnect'
          - '--no-usage-statistics'
          - '--no-performance-crux'

    - id: chrome-devtools-skills-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: chrome-devtools-skills
        includeDefaultRoots: false
        customSkillDirs:
          - !!js |-
            (() => {
              const fs = process.getBuiltinModule('node:fs');
              const path = process.getBuiltinModule('node:path');
              const os = process.getBuiltinModule('node:os');
              const { createRequire } = process.getBuiltinModule('node:module');

              // ctx.baseUrl 指向 profile 目录，而不是提供本 patch 的 bundle 目录。
              // 因此从这个锚点解析本包的真实安装位置（与 dsh 自己的 preset patch 同一手法）。
              const pkgDir = path.dirname(
                createRequire(String(ctx.baseUrl ?? '')).resolve('@jedeiah/chrome-devtools-mcp/package.json'),
              );
              const dest = path.join(pkgDir, 'skills');

              // 机会性刷新：npx 缓存里若有 chrome-devtools-mcp 的 skills，覆盖副本（best effort）。
              try {
                const npxRoot = path.join(os.homedir(), '.npm', '_npx');
                for (const entry of fs.readdirSync(npxRoot)) {
                  const src = path.join(npxRoot, entry, 'node_modules', 'chrome-devtools-mcp', 'skills');
                  if (fs.existsSync(src)) {
                    fs.cpSync(src, dest, { recursive: true, force: true });
                    break;
                  }
                }
              } catch {
                // 缓存不存在属正常：副本本身就是基线。
              }

              return dest;
            })()
