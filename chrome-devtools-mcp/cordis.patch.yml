# Chrome DevTools MCP — provided by the local bundle @jedeiah/chrome-devtools-mcp.
#
# 四条 insert：
#
#   ① chrome-devtools-mcp      本包（Host 半 + Client 半）。Host 半持有 `skills` 与 `browser`
#                              两个开关；Client 半在 Plugins 页面提供设置页。
#                              行名必须是本包名 —— 浏览器模块表按行名取包，写官方桥名的话
#                              本包的 Client 半边永远不会被加载。
#
#   ② chrome-devtools-launch   ┐ 两条**互斥**的官方 `@deepseek-ai/dsh-mcp-client` 桥：由 npx 经
#   ③ chrome-devtools-attach   ┘ stdio 拉起 chrome-devtools-mcp，工具注册为
#                              `mcp__chrome-devtools__<tool>`。由本包的 `browser` 开关二选一。
#
#       launch —— 不给 `--autoConnect`，MCP 自己拉起一个 Chrome，用
#                 `~/.cache/chrome-devtools-mcp/chrome-profile` 当 profile。
#                 **用户零操作**；代价是那是独立浏览器，没有你当前的登录态与标签页。
#       attach —— 带 `--autoConnect`，接管你**正在用**的 Chrome，复用登录态与已开标签页。
#                 前提：Chrome 144+，且在 `chrome://inspect/#remote-debugging` 打开
#                 Remote Debugging；另外每次连接 Chrome 还会弹一次 Allow 让用户确认。
#
#       **两者 `serverName` 不同**（`chrome-devtools` / `chrome-devtools-attach`），
#       所以可以短暂并存而不冲突。这一条是必需的：插件列表给每行都配了开关，用户点了
#       哪一行就可能多起一条，同名会让那一次点击必然以 `serverName is already in use` 失败。
#
#       切换方式：设置页的 `browser` 开关是**唯一真源**。Host 半每秒核对 profile patch，
#       一次原子写两条 `disabled`（profile 层按 id 覆盖 bundle 层，见 cordis-plugin-include
#       的 `applyEntryPatches`）。dsh 的 HMR 监视着 profile patch，而 loader **按 id 比较**
#       条目、只重挂变化的那几行 —— 所以切换是**即点即生效**的，不用重启，也不碰别的行。
#
#       插件列表里那两行的开关被**当成意图**：点开另一条 = "我要换成那个模式"。Host 半会
#       把它写回设置页的值（`ctx.settings.update`），于是两处永远一致；点错了也只会被
#       纠正回去，不会有冲突报错。
#
#       不用 `plugin_manager.setPluginEnabled()` 逐条切：那要调两次，而第一次返回时旧行的
#       fiber 还没卸载，第二次启用就可能撞上冲突。自己一次写完两条没有这个中间态。
#       也不在 `args` 里用 `!!js` 读包内文件：config 里的 `!!js` **只在条目激活时求值**，
#       而改包内文件不会让任何条目激活 —— 那样切换就必须重启 dsh。
#
#   ④ chrome-devtools-skills   技能提供方，扫本包的 `skills-live/`。
#                              那个目录由 Host 半按 `skills` 开关维护：开则把 `skills/` 下每个
#                              技能软链进去，关则清空。官方 provider 的文件监视器（默认跟随软链）
#                              会自己感知，于是技能在会话目录里实时出现或消失 —— 不用重挂、不用重启。
#
# `chrome-devtools-mcp` 由宿主 PATH 上的 `npx` 解析并缓存到 ~/.npm/_npx，
# 因此首次运行需要宿主有 node/npm 与 registry 访问。

- insert:
    - id: chrome-devtools-mcp
      name: '@jedeiah/chrome-devtools-mcp'

    # 自己拉起 Chrome：零操作，独立 profile（~/.cache/chrome-devtools-mcp/chrome-profile）。
    - id: chrome-devtools-launch
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome-devtools
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'chrome-devtools-mcp@latest'
          - '--no-usage-statistics'
          - '--no-performance-crux'

    # 接管你自己的浏览器：复用登录态，但需先开 Remote Debugging 并逐次确认。
    #
    # `serverName` 刻意与 ② 不同。相同的话，在插件列表里点开这一行会撞上
    # `serverName is already in use` —— 列表里的开关只改自己那一行，管不了另一行，
    # 于是那一次点击必然失败。不同名则两条可以短暂并存，Host 半随后按设置页的值纠正。
    - id: chrome-devtools-attach
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome-devtools-attach
        transport: stdio
        command: npx
        args:
          - '-y'
          - 'chrome-devtools-mcp@latest'
          - '--autoConnect'
          - '--no-usage-statistics'
          - '--no-performance-crux'
      disabled: true

    - id: chrome-devtools-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: chrome-devtools-skills
        includeDefaultRoots: false
        customSkillDirs:
          - !!js |-
            (() => {
              const path = process.getBuiltinModule('node:path');
              const { createRequire } = process.getBuiltinModule('node:module');

              // ctx.baseUrl 指向 profile 目录，而不是提供本 patch 的 bundle 目录。
              // 因此从这个锚点解析本包的真实安装位置（与 dsh 自己的 preset patch 同一手法）。
              const pkgDir = path.dirname(
                createRequire(String(ctx.baseUrl ?? '')).resolve('@jedeiah/chrome-devtools-mcp/package.json'),
              );
              return path.join(pkgDir, 'skills-live');
            })()
